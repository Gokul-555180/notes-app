<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Notes Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="glass">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"></path>
                    <line x1="16" y1="8" x2="2" y2="22"></line>
                    <line x1="17.5" y1="15" x2="9" y2="15"></line>
                </svg>
                <h1>Smart Notes Pro</h1>
            </div>
            <button id="theme-toggle" class="icon-btn" title="Toggle Dark/Light Mode">
                <svg id="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                <svg id="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
        </header>

        <main>
            <!-- Note Creation Section -->
            <section class="create-note-section glass">
                <input type="text" id="note-title" placeholder="Note Title..." autocomplete="off">
                <textarea id="note-content" placeholder="Write your context here... (Supports Markdown)" rows="3"></textarea>
                <div class="note-actions">
                    <button id="add-note-btn" class="primary-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        <span id="add-btn-text">Add Note</span>
                    </button>
                    <button id="cancel-edit-btn" class="secondary-btn hidden">Cancel</button>
                </div>
            </section>

            <!-- Controls Section -->
            <section class="controls-section glass">
                <div class="search-box">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="search-bar" placeholder="Search notes...">
                </div>
                
                <div class="filters">
                    <select id="sort-select">
                        <option value="newest">Sort by: Newest First</option>
                        <option value="oldest">Sort by: Oldest First</option>
                    </select>
                    <div class="export-actions">
                        <button id="export-txt" class="secondary-btn" title="Export as TXT">TXT</button>
                        <button id="export-json" class="secondary-btn" title="Export as JSON">JSON</button>
                    </div>
                </div>
            </section>

            <!-- Notes Container -->
            <section id="notes-container" class="masonry-grid"></section>
        </main>
    </div>

    <!-- Hidden Template for single note -->
    <template id="note-template">
        <article class="note-card glass">
            <div class="note-header">
                <h3 class="note-title"></h3>
                <button class="icon-btn pin-btn" title="Pin Note">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19"></path><line x1="15.42" y1="15.42" x2="21.44" y2="21.44"></line></svg>
                </button>
            </div>
            
            <div class="ai-features">
                <div class="mood-badge badge"></div>
                <div class="tags-container"></div>
            </div>

            <p class="note-summary"></p>
            <div class="note-content markdown-body"></div>
            
            <div class="note-footer">
                <span class="note-date"></span>
                <div class="card-actions">
                    <button class="icon-btn edit-btn" title="Edit Note">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                    </button>
                    <button class="icon-btn delete-btn" title="Delete Note">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    </button>
                </div>
            </div>
        </article>
    </template>

    <script src="script.js"></script>
</body>
</html>
